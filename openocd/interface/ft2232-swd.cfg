# FT2232H interface configuration for SWD
# Based on OpenOCD minimodule-swd.cfg
#
# Wiring:
#   ADBUS0 (TCK)  -> SWCLK
#   ADBUS1 (TDO)  -> SWDIO  (directly connect both pins)
#   ADBUS2 (TDI)  -> SWDIO
#   GND           -> GND

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010

ftdi channel 0

ftdi layout_init 0x0000 0x000b
ftdi layout_signal nSRST -data 0x0010 -oe 0x0010
ftdi layout_signal SWD_EN -data 0
ftdi layout_signal SWDIO_OE -data 0

transport select swd

reset_config none

adapter speed 1000
